[package]
name = "gmid"
version = "0.1.0"
edition = "2021"
description = "A small top-down arena shooter built with Rust, SDL3 and egui"
license = "MIT"

[dependencies]
sdl3 = { version = "0.18.4", features = ["use-pkg-config"] }
egui-sdl3 = { version = "0.4.0", default-features = false, features = ["canvas-backend", "sdl3-use-pkgconfig"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
